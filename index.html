<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JARVIS — Advanced OS</title>
    <style>
        /* Add this to your existing CSS for a "pulse" effect during listening */
        .orb.listening {
            box-shadow: 0 0 50px #ff4466;
            border-color: #ff4466;
        }
    </style>
</head>
<body>
    <script>
        /**
         * JARVIS CORE ENGINE
         * Using Web Speech API (Synthesis & Recognition)
         */
        const JarvisConfig = {
            wakeWord: "hey jarvis",
            model: "claude-3-5-sonnet", // Placeholder for logic
            isListening: false,
            isSpeaking: false
        };

        // Initialize Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = SpeechRecognition ? new SpeechRecognition() : null;
        const synth = window.speechSynthesis;

        if (recognition) {
            recognition.continuous = false; // Set to true for "always listening"
            recognition.interimResults = false;
            recognition.lang = 'en-US';
        }

        /**
         * 1. THE VOICE: TEXT-TO-SPEECH
         */
        function speak(text) {
            // Cancel any ongoing speech
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            
            // JARVIS Personality Settings
            utterance.rate = 1.0; 
            utterance.pitch = 0.9; // Slightly lower for a "sophisticated" tone

            // Select a British Male voice if available
            const voices = synth.getVoices();
            const jarvisVoice = voices.find(v => v.name.includes("Google UK English Male") || v.name.includes("Daniel"));
            if (jarvisVoice) utterance.voice = jarvisVoice;

            utterance.onstart = () => setOrbState('speaking');
            utterance.onend = () => {
                setOrbState('idle');
                // Auto-resume wake word detection after JARVIS finishes speaking
                if (JarvisConfig.wakeActive) startWakeWordMonitor();
            };

            synth.speak(utterance);
        }

        /**
         * 2. THE EARS: SPEECH-TO-TEXT
         */
        function startListening() {
            if (!recognition) {
                updateStatus("Browser not supported", "red");
                return;
            }

            try {
                recognition.start();
                setOrbState('listening');
            } catch (e) {
                console.error("Recognition already started or blocked:", e);
            }
        }

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.toLowerCase();
            updateTranscript(transcript);
            handleCommand(transcript);
        };

        recognition.onerror = (event) => {
            console.error("Speech Error:", event.error);
            setOrbState('idle');
            if(event.error === 'not-allowed') {
                alert("Please enable Microphone access in your browser settings and use HTTPS.");
            }
        };

        /**
         * 3. THE BRAIN: COMMAND HANDLING
         */
        async function handleCommand(command) {
            setOrbState('thinking');
            
            // Logic for local commands vs AI API calls
            if (command.includes("time")) {
                const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                speak(`The current time is ${now}, sir.`);
            } 
            else if (command.includes("system status")) {
                speak("All systems are functional. Connection to neural grid is stable.");
            }
            else {
                // Here you would normally fetch from your OpenAI/Claude API
                // For now, we simulate a response
                simulateAIResponse(command);
            }
        }

        // --- Helper Functions ---
        function setOrbState(state) {
            const orb = document.getElementById('orb');
            orb.className = 'orb ' + state;
            // Update label/icons based on your existing UI logic
        }

        function updateTranscript(text) {
            document.getElementById('transcript-box').innerText = text;
        }

        function updateStatus(msg, color) {
            const status = document.getElementById('wake-status');
            status.style.color = `var(--${color})`;
            status.innerText = msg;
        }

        async function simulateAIResponse(input) {
            // This is where you would call your API
            setTimeout(() => {
                speak("Processing your request. I've analyzed the query regarding " + input);
            }, 1000);
        }

        // Initialize voices
        window.speechSynthesis.onvoiceschanged = () => synth.getVoices();

    </script>
</body>
</html>
